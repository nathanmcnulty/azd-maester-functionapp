name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  BICEP_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or newer is required.' }
          Write-Host "Validation PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
      - name: Run repository tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Write-Host "Validation Pester: $((Get-Module Pester).Version)"
          Invoke-Pester -Path ./tests -CI
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Qualify actual locked Maester 2.3.0 results offline
        run: |
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'maester-230-qualification-modules'
          ./scripts/Install-LockedModules.ps1 -LockPath ./runtime-packages.lock.json -DestinationRoot $moduleRoot -PackageNames @('Microsoft.Graph.Authentication', 'Pester', 'Maester')
          $env:PSModulePath = $moduleRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          ./tests/Invoke-Maester230Compatibility.ps1
